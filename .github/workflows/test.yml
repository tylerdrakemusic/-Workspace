name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up peer contract
        env:
          PEER_REPOSITORY: tylerdrakemusic/AI-Manifest
        run: |
          set -euo pipefail
          peer_url="https://github.com/${PEER_REPOSITORY}.git"
          selected_ref="main"
          summary_ref="main"
          peer_sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -z "${GITHUB_HEAD_REF:-}" ]]; then
            echo "GITHUB_HEAD_REF is empty for a pull request" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_HEAD_REF:-}" ]]; then
            lookup_succeeded=false
            for attempt in 1 2 3; do
              if lookup_result="$(git ls-remote "$peer_url" "refs/heads/${GITHUB_HEAD_REF}")"; then
                lookup_succeeded=true
                if [[ -n "$lookup_result" ]]; then
                  selected_ref="$GITHUB_HEAD_REF"
                  summary_ref="$GITHUB_HEAD_REF"
                  peer_sha="${lookup_result%%$'\t'*}"
                else
                  summary_ref="main (unpaired consumer PR)"
                  echo "No matching producer branch for PR head: ${GITHUB_HEAD_REF}; using peer main because this PR is unpaired." >&2
                fi
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
            done
            if [[ "$lookup_succeeded" != true ]]; then
              echo "Peer branch lookup failed after 3 attempts" >&2
              exit 1
            fi
          fi

          if [[ -z "$peer_sha" ]]; then
            main_lookup_succeeded=false
            for attempt in 1 2 3; do
              if lookup_result="$(git ls-remote "$peer_url" refs/heads/main)" && [[ -n "$lookup_result" ]]; then
                main_lookup_succeeded=true
                peer_sha="${lookup_result%%$'\t'*}"
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
            done
            if [[ "$main_lookup_succeeded" != true ]]; then
              echo "Peer main lookup failed after 3 attempts" >&2
              exit 1
            fi
          fi

          git init ai-manifest-contract
          checkout_succeeded=false
          for attempt in 1 2 3; do
            if git -C ai-manifest-contract fetch --depth=1 "$peer_url" "$peer_sha" \
              && git -C ai-manifest-contract checkout --detach FETCH_HEAD; then
              checkout_succeeded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
          done
          if [[ "$checkout_succeeded" != true ]]; then
            echo "Peer checkout failed after 3 attempts" >&2
            exit 1
          fi

          checked_out_sha="$(git -C ai-manifest-contract rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$peer_sha" ]]; then
            echo "Peer checkout SHA did not match resolved SHA" >&2
            exit 1
          fi
          {
            echo "### Peer contract source"
            echo "- Peer repository: ${PEER_REPOSITORY}"
            echo "- Selected ref: ${summary_ref}"
            echo "- Checked-out SHA: ${checked_out_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Install pinned Ruff for advisory checks
        run: |
          if python -m pip install ruff==0.17.2; then
            echo "Pinned Ruff installed."
          else
            echo "Ruff installation failed; the advisory report will record the tool error." >&2
          fi

      - name: Run advisory Ruff checks
        if: always()
        run: |
          python - <<'PY' || echo "Advisory report generation failed; CI remains advisory." >&2
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          output_dir = Path("tmp/ruff-advisory")
          output_dir.mkdir(parents=True, exist_ok=True)

          def run(command):
              try:
                  result = subprocess.run(command, capture_output=True, text=True, check=False)
                  return {
                      "returncode": result.returncode,
                      "stdout": result.stdout,
                      "stderr": result.stderr,
                  }
              except OSError as error:
                  return {"returncode": None, "stdout": "", "stderr": str(error)}

          ruff_command = [sys.executable, "-m", "ruff"]
          version_result = run(ruff_command + ["--version"])
          started = time.perf_counter()
          check_result = run(ruff_command + ["check", "--output-format=json", "."])
          format_result = run(ruff_command + ["format", "--check", "--diff", "."])
          elapsed_seconds = round(time.perf_counter() - started, 3)

          try:
            check_data = json.loads(check_result["stdout"])
            check_findings = len(check_data) if isinstance(check_data, list) else None
          except json.JSONDecodeError:
            check_findings = None

          format_output = format_result["stdout"] + format_result["stderr"]
          format_match = re.search(r"(?m)^(\d+) files? would be reformatted\b", format_output)
          format_findings = (
              int(format_match.group(1))
              if format_match
              else 0 if format_result["returncode"] == 0 else None
          )
          config_path = Path("ruff.toml")
          config_sha256 = hashlib.sha256(config_path.read_bytes()).hexdigest()
          commit_result = run(["git", "rev-parse", "HEAD"])
          report = {
              "fr_id": "FR-20261025-ruff-advisory-lint-rollout",
              "repository": os.environ.get("GITHUB_REPOSITORY", "local"),
              "commit": commit_result["stdout"].strip() or "unavailable",
              "ruff_version": version_result["stdout"].strip() or "unavailable",
              "config": {"path": str(config_path), "sha256": config_sha256},
              "scan_scope": (
                  "All non-ignored Python .py files under the repository root; "
                  "Ruff defaults and ruff.toml exclude environments, caches, .worktrees, "
                  "tmp, and output. Non-Python files, including databases, are not scanned."
              ),
              "elapsed_seconds": elapsed_seconds,
              "finding_counts": {
                  "ruff_check": check_findings,
                  "ruff_format": format_findings,
              },
              "command_exit_codes": {
                  "ruff_check": check_result["returncode"],
                  "ruff_format_check": format_result["returncode"],
              },
              "tool_errors": {
                  "ruff_version": version_result["stderr"].strip() or None,
                  "ruff_check": check_result["stderr"].strip() or None,
                  "ruff_format": format_result["stderr"].strip() or None,
              },
          }

          (output_dir / "ruff-check.json").write_text(
              check_result["stdout"], encoding="utf-8"
          )
          (output_dir / "ruff-format.txt").write_text(format_output, encoding="utf-8")
          (output_dir / "summary.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )

          check_count = "unavailable" if check_findings is None else str(check_findings)
          format_count = "unavailable" if format_findings is None else str(format_findings)
          summary = "\n".join(
              [
                  "## FR-20261025-ruff-advisory-lint-rollout: Workspace pilot",
                  "",
                  f"- Repository: `{report['repository']}`",
                  f"- Scanned commit: `{report['commit']}`",
                  f"- Ruff: `{report['ruff_version']}`",
                  f"- Config revision: `ruff.toml` SHA-256 `{config_sha256}`",
                  f"- Scope: {report['scan_scope']}",
                  f"- Elapsed: {elapsed_seconds:.3f} seconds",
                  f"- Findings: `ruff check` {check_count}; `ruff format --check` {format_count}",
                  "- Advisory only: findings and Ruff command errors do not gate CI.",
                  "",
              ]
          )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)
          print(summary)
          PY

      - name: Audit dependencies
        run: python tools/audit_workspace_requirements.py requirements.txt

      - name: Run pytest
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
          AI_MANIFEST_CONTRACT_PATH: ${{ github.workspace }}/ai-manifest-contract/src/contracts/todo_decision_metadata.v1.json
        run: python tools/run_tests.py --parallel --junitxml=tmp/pytest-junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tmp/pytest-junit.xml

      - name: Upload advisory Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-advisory-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ruff-advisory/
          if-no-files-found: warn
          retention-days: 30
