name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up peer contract
        env:
          PEER_REPOSITORY: tylerdrakemusic/AI-Manifest
        run: |
          set -euo pipefail
          peer_url="https://github.com/${PEER_REPOSITORY}.git"
          selected_ref="main"
          summary_ref="main"
          peer_sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -z "${GITHUB_HEAD_REF:-}" ]]; then
            echo "GITHUB_HEAD_REF is empty for a pull request" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_HEAD_REF:-}" ]]; then
            lookup_succeeded=false
            for attempt in 1 2 3; do
              if lookup_result="$(git ls-remote "$peer_url" "refs/heads/${GITHUB_HEAD_REF}")"; then
                lookup_succeeded=true
                if [[ -n "$lookup_result" ]]; then
                  selected_ref="$GITHUB_HEAD_REF"
                  summary_ref="$GITHUB_HEAD_REF"
                  peer_sha="${lookup_result%%$'\t'*}"
                else
                  summary_ref="main (unpaired consumer PR)"
                  echo "No matching producer branch for PR head: ${GITHUB_HEAD_REF}; using peer main because this PR is unpaired." >&2
                fi
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
            done
            if [[ "$lookup_succeeded" != true ]]; then
              echo "Peer branch lookup failed after 3 attempts" >&2
              exit 1
            fi
          fi

          if [[ -z "$peer_sha" ]]; then
            main_lookup_succeeded=false
            for attempt in 1 2 3; do
              if lookup_result="$(git ls-remote "$peer_url" refs/heads/main)" && [[ -n "$lookup_result" ]]; then
                main_lookup_succeeded=true
                peer_sha="${lookup_result%%$'\t'*}"
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
            done
            if [[ "$main_lookup_succeeded" != true ]]; then
              echo "Peer main lookup failed after 3 attempts" >&2
              exit 1
            fi
          fi

          git init ai-manifest-contract
          checkout_succeeded=false
          for attempt in 1 2 3; do
            if git -C ai-manifest-contract fetch --depth=1 "$peer_url" "$peer_sha" \
              && git -C ai-manifest-contract checkout --detach FETCH_HEAD; then
              checkout_succeeded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
          done
          if [[ "$checkout_succeeded" != true ]]; then
            echo "Peer checkout failed after 3 attempts" >&2
            exit 1
          fi

          checked_out_sha="$(git -C ai-manifest-contract rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$peer_sha" ]]; then
            echo "Peer checkout SHA did not match resolved SHA" >&2
            exit 1
          fi
          {
            echo "### Peer contract source"
            echo "- Peer repository: ${PEER_REPOSITORY}"
            echo "- Selected ref: ${summary_ref}"
            echo "- Checked-out SHA: ${checked_out_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Install pinned Ruff for advisory checks
        env:
          RUFF_ADVISORY_LOCAL_DIR: tmp/ruff-advisory-local/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          install_status=1
          if mkdir -p "$RUFF_ADVISORY_LOCAL_DIR"; then
            if python -m pip install --disable-pip-version-check ruff==0.17.2 \
                > "$RUFF_ADVISORY_LOCAL_DIR/ruff-install.stdout.txt" 2> "$RUFF_ADVISORY_LOCAL_DIR/ruff-install.stderr.txt"; then
              install_status=0
              echo "Pinned Ruff installed."
            else
              install_status=$?
              echo "Pinned Ruff install failed; the advisory report will show a generic tool error." >&2
            fi
          else
            echo "Ruff installation skipped; local advisory output is unavailable." >&2
          fi
          if [[ -d "$RUFF_ADVISORY_LOCAL_DIR" ]]; then
            printf '%s\n' "$install_status" > "$RUFF_ADVISORY_LOCAL_DIR/ruff-install.exit-code" || echo "Could not persist Ruff install status locally." >&2
          fi
          printf 'RUFF_INSTALL_EXIT_CODE=%s\n' "$install_status" >> "$GITHUB_ENV" || echo "Could not export Ruff install status; CI remains advisory." >&2

      - name: Run advisory Ruff checks
        if: always()
        env:
          RUFF_ADVISORY_LOCAL_DIR: tmp/ruff-advisory-local/${{ github.run_id }}-${{ github.run_attempt }}
          RUFF_ADVISORY_CI_DIR: tmp/ruff-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if mkdir -p "$RUFF_ADVISORY_LOCAL_DIR" "$RUFF_ADVISORY_CI_DIR"; then
            if python tools/ruff_ci_advisory.py \
              --config-path ruff.toml \
              --local-output-dir "$RUFF_ADVISORY_LOCAL_DIR" \
              --ci-output-dir "$RUFF_ADVISORY_CI_DIR" \
              --step-summary "$GITHUB_STEP_SUMMARY" \
              > "$RUFF_ADVISORY_LOCAL_DIR/ruff-advisory-helper.stdout.txt" \
              2> "$RUFF_ADVISORY_LOCAL_DIR/ruff-advisory-helper.stderr.txt"; then
              :
            else
              echo "Advisory report generation failed; CI remains advisory." >&2
            fi
          else
            echo "Advisory output directories unavailable; CI remains advisory." >&2
          fi

      - name: Audit dependencies
        run: python tools/audit_workspace_requirements.py requirements.txt

      - name: Run pytest
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
          AI_MANIFEST_CONTRACT_PATH: ${{ github.workspace }}/ai-manifest-contract/src/contracts/todo_decision_metadata.v1.json
        run: python tools/run_tests.py --parallel --junitxml=tmp/pytest-junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tmp/pytest-junit.xml

      - name: Upload advisory Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-advisory-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ruff-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 30
