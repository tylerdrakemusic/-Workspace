[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not integration"
markers =
    playwright: marks tests as requiring Playwright browser (skip in CI unless PLAYWRIGHT_ENABLED=1)
    integration: marks tests that call live external APIs (never run in CI; run locally with -m integration)
