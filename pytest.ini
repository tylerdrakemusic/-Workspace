[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    playwright: marks tests as requiring Playwright browser (skip in CI unless PLAYWRIGHT_ENABLED=1)
    integration: marks tests that call live external APIs (collected in CI; run locally with -m integration)
    live: marks opt-in live-network probes (excluded from CI via tools/parallel_test_policy.json; run locally with -m live and MERMAID_LIVE_PROBE=1)
